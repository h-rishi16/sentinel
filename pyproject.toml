[project]
name = "sentinel"
version = "0.1.0"
description = "Financial Risk Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "yfinance>=0.2",
    "pyarrow>=15.0",
    "statsmodels>=0.14",
    "arch>=7.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "fastapi>=0.103.2",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.3",
]
